# Deploy the site to GitHub Pages.
#
# A push to main first runs the checks (checks.yml) and deploys only if they all
# pass.  To deploy by hand regardless (Actions -> Deploy site -> Run workflow on
# main), tick "skip_checks".  Other branches (e.g. dev) only run checks.yml.
#
# The site itself needs no build. The one generated piece is nojs/, the
# text-only copy of each page for visitors with JavaScript turned off. It is
# git-ignored, so this workflow builds it (tools/build_nojs.py) and then
# publishes the whole folder.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions" (instead of "Deploy from a branch").
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: Deploy without running the checks first
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    # A skipped "checks" (skip_checks ticked) still deploys; a failed one does not.
    # Only ever deploy main, even if the workflow is run by hand from another branch.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && contains(fromJSON('["success", "skipped"]'), needs.checks.result) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # build_nojs.py is plain Python (preinstalled); node reads the .js data files.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the text-only (no-JavaScript) pages
        run: python3 tools/build_nojs.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
